[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krengjai-alignment"
version = "0.1.0"
description = "Evaluation-first Thai character alignment research with sovereign language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
baseline = [
  "torch>=2.2",
  "transformers>=4.45",
]

[project.scripts]
krengjai-validate = "krengjai.cli:main"
krengjai-review = "krengjai.review:main"

[tool.setuptools.packages.find]
where = ["src"]
